server {
    listen 80;
    listen [::]:80;
    server_name tracerag.hnustuc.xyz;
    location /.well-known/acme-challenge/ { root /var/www/tracerag-acme; }
    location / { return 301 https://tracerag.hnustuc.xyz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tracerag.hnustuc.xyz;
    ssl_certificate /etc/letsencrypt/live/tracerag.hnustuc.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracerag.hnustuc.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic "TraceRAG research console";
    auth_basic_user_file /etc/tracerag/htpasswd;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_read_timeout 650s;
    }
}
