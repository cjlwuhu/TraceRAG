# Initial HTTP vhost: obtain the certificate before enabling the HTTPS vhost.
server {
    listen 80;
    listen [::]:80;
    server_name tracerag.hnustuc.xyz;
    location /.well-known/acme-challenge/ {
        root /var/www/tracerag-acme;
    }
    location / { return 301 https://tracerag.hnustuc.xyz$request_uri; }
}
